name: Deploy

on:
  # On push
  push:
    branches: [ production ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout build
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Extract version from plugin file
      id: get_version
      run: |
        VERSION=$(grep -oP "Version:\s+\K[\d\.]+" woo-custom-gateway.php)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version found: $VERSION"
    
    - name: Check if tag exists
      id: check_tag
      run: |
        if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Tag v${{ steps.get_version.outputs.version }} already exists"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Tag v${{ steps.get_version.outputs.version }} does not exist - proceeding with deployment"
        fi
    
    - name: Setup Node.js
      if: steps.check_tag.outputs.exists == 'false'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install npm dependencies
      if: steps.check_tag.outputs.exists == 'false'
      run: npm install
    
    - name: Build JavaScript assets
      if: steps.check_tag.outputs.exists == 'false'
      run: npm run dist
    
    - name: Cache Composer dependencies
      if: steps.check_tag.outputs.exists == 'false'
      uses: actions/cache@v5
      with:
        path: /tmp/composer-cache
        key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
      
    - name: Composer Setup
      if: steps.check_tag.outputs.exists == 'false'
      uses: php-actions/composer@v6
      with:
        dev: no
        php_version: "7.4"
        version: latest
        command: install
    
    - name: Create Git tag
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release version ${{ steps.get_version.outputs.version }}"
        git push origin "v${{ steps.get_version.outputs.version }}"
      
    - name: Copy to build dir
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        mkdir build
        rsync -rvt --delete --include 'vendor' --include 'src/Views/js/dist' --exclude-from='.gitignore' --exclude '.git*' --exclude 'build' --exclude 'ui' --exclude 'node_modules' --exclude 'src/Views/js/src' ./ build/
      
    - name: WordPress Plugin Deploy
      if: steps.check_tag.outputs.exists == 'false'
      id: deploy
      uses: richard-muvirimi/deploy-wordpress-plugin@development
      with:
        svn-username: ${{ secrets.SVN_USERNAME }}
        svn-password: ${{ secrets.SVN_PASSWORD }}
        plugin-repository: woo-custom-gateway
        working-directory: build
