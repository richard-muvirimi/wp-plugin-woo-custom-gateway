name: Deploy

on:
  # On push
  push:
    branches: [ production ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout build
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install npm dependencies
      run: npm ci
    
    - name: Build JavaScript assets
      run: npm run dist
    
    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: /tmp/composer-cache
        key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
      
    - name: Composer Setup
      uses: php-actions/composer@v6
      with:
        dev: no
        php_version: "7.4"
        version: latest
        command: install
      
    - name: Copy to build dir
      run: |
        mkdir build
        rsync -rvt --delete --include 'vendor' --include 'src/Views/js/dist' --exclude-from='.gitignore' --exclude '.git*' --exclude 'build' --exclude 'ui' --exclude 'node_modules' --exclude 'src/Views/js/src' ./ build/
      
    - name: WordPress Plugin Deploy
      id: deploy
      uses: richard-muvirimi/deploy-wordpress-plugin@development
      with:
        svn-username: ${{ secrets.SVN_USERNAME }}
        svn-password: ${{ secrets.SVN_PASSWORD }}
        plugin-repository: woo-custom-gateway
        working-directory: build
